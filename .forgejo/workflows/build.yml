name: Build

on:
  push:
    paths:
      - app/**
      - core/**
      - gradle/**
      - vendor/**
      - build.gradle.kts
      - settings.gradle.kts
      - .forgejo/workflows/build.yml
      - "!**/strings.xml"
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    paths:
      - app/**
      - core/**
      - gradle/**
      - vendor/**
      - build.gradle.kts
      - settings.gradle.kts
      - .forgejo/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    # for now dont build for prs because it causes so many issues
    if: ${{ forgejo.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Restore SDK cache
        id: sdk
        uses: actions/cache/restore@v6
        with:
          path: ~/.android/sdk
          key: ${{ runner.os }}-v3-sdk-cmake-3.30.5-${{ hashFiles('gradle/libs.versions.toml', 'vendor/androidx-media/libraries/decoder_ffmpeg/build.gradle.kts') }}

      - name: Resolve TagLib cache key
        id: taglib-key
        shell: bash
        run: |
          revision=$(git -C vendor/musikr/src/main/cpp/taglib rev-parse HEAD)
          inputs_hash=$(sha256sum \
            vendor/musikr/src/main/cpp/build_taglib.sh \
            vendor/musikr/src/main/cpp/CMakeLists.txt \
            vendor/musikr/src/main/cpp/android.toolchain.cmake \
            vendor/musikr/build.gradle.kts \
            gradle/libs.versions.toml | sha256sum | cut -c1-16)
          echo "key=${{ runner.os }}-v3-taglib-${revision}-${inputs_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore TagLib cache
        id: taglib
        uses: actions/cache/restore@v6
        with:
          path: vendor/musikr/src/main/cpp/taglib/pkg
          key: ${{ steps.taglib-key.outputs.key }}

      - name: Resolve FFmpeg cache key
        id: ffmpeg-key
        run: |
          echo "key=ffmpeg-v3-$(git -C vendor/androidx-media rev-parse HEAD)-$(git -C vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg rev-parse HEAD)-${{ hashFiles('gradle/libs.versions.toml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg build
        id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: |
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/config.h
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/config_components.h
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/avconfig.h
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/ffversion.h
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - name: Restore project cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-v2-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-v2-gradle-

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # TODO: check if it's possible to remove this by replacing with something faster for accepting licenses
      # this only seems to accept the licenses and nothing else, Gradle will download the SDK anyway (afaik)
      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@v4

      - name: Install CMake
        run: sdkmanager "cmake;3.30.5"

      - name: Build with Gradle (release)
        id: build_release
        shell: bash
        if: ${{ (forgejo.event_name == 'push' || forgejo.event_name == 'workflow_dispatch') && env.SIGNING_KEY_ALIAS }}
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ forgejo.workspace }}/release.keystore
          IS_RELEASE: ${{ startsWith(forgejo.ref, 'refs/tags/v') }}
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          ./gradlew :app:packageDefaultRelease --stacktrace --no-daemon --no-watch-fs
          mv app/build/outputs/apk/**/**/*.apk ./
          if [ "$IS_RELEASE" = true ] ; then
            ./gradlew :app:packageFdroidRelease --stacktrace --no-daemon --no-watch-fs
            mv app/build/outputs/apk/**/**/*.apk ./
          fi
          rm release.keystore

      - name: Upload APK artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: navic-release-android
          path: ./*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Save project cache
        uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Save TagLib cache
        uses: actions/cache/save@v6
        if: steps.taglib.outputs.cache-hit != 'true'
        with:
          path: vendor/musikr/src/main/cpp/taglib/pkg
          key: ${{ steps.taglib-key.outputs.key }}

      - name: Save FFmpeg build
        uses: actions/cache/save@v6
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          path: |
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/config.h
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/config_components.h
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/avconfig.h
            vendor/androidx-media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/ffversion.h
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Save SDK cache
        uses: actions/cache/save@v6
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          path: ~/.android/sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}

  notify-discord:
    name: Notify Discord
    if: forgejo.event_name == 'push' && (forgejo.ref == 'refs/heads/master' || forgejo.ref == 'refs/heads/bleeding-edge')
    needs: [ build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: Post build link to Discord
        shell: bash
        env:
          FULL_MSG: ${{ forgejo.event.head_commit.message }}
          CI_BUILD_WEBHOOK: ${{ secrets.CI_BUILD_WEBHOOK }}
          BLEEDING_EDGE_CI_WEBHOOK: ${{ secrets.BLEEDING_EDGE_CI_WEBHOOK }}
          REF_NAME: ${{ forgejo.ref_name }}
        run: |
          if [ "$REF_NAME" = "bleeding-edge" ] && [ -n "$BLEEDING_EDGE_CI_WEBHOOK" ]; then
            WEBHOOK_URL="$BLEEDING_EDGE_CI_WEBHOOK"
          else
            WEBHOOK_URL="$CI_BUILD_WEBHOOK"
          fi
          COMMIT_TITLE=$(printf '%s\n' "$FULL_MSG" | head -n 1 | sed 's/`/\\`/g')

          run_url="${{ forgejo.server_url }}/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_id }}"
          artifact_url="$run_url/artifacts/navic-release-android"

          # artifacts are public on codeberg, everyone can download them. even logged out. :)
          content=$(printf 'Builds for [%s](<%s>)\n\n(%s) - `%s`\n%s' \
            "${GITHUB_SHA:0:7}" "$run_url" "$REF_NAME" "$COMMIT_TITLE" "$artifact_url")
          payload=$(jq -n --arg content "$content" '{content: $content}')

          curl --fail -XPOST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload"

  create-release:
    name: Create release
    if: forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/v')
    needs: [ build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          path: release

      - name: Publish release
        uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: release
          token: ${{ secrets.TOKEN }}
          override: true
          verbose: true
          hide-archive-link: true
          release-notes-assistant: true
